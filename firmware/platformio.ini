; Optional: build with PlatformIO instead of the Arduino IDE.
;   pio run           (build)
;   pio run -t upload (flash)
[platformio]
src_dir = epaper_dashboard

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv ; two OTA slots ("Minimal SPIFFS" in the IDE)
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    bblanchon/ArduinoJson@^7.0.0

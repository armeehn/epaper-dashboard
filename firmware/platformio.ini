; Optional: build with PlatformIO instead of the Arduino IDE.
;   pio run           (build)
;   pio run -t upload (flash)
[platformio]
src_dir = epaper_dashboard

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv   ; matches the Arduino IDE "Huge APP" scheme
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    bblanchon/ArduinoJson@^7.0.0

name: ci
# Branch pushes are covered by the pull_request trigger, so `push` is limited to
# main and release tags. Otherwise every commit on a PR branch runs the suite
# twice. Use the Actions tab ("Run workflow") to build a branch that has no PR.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-verification:
    runs-on: ubuntu-latest
    steps:
      # registry/ (the epaper-blocks submodule) provides the signed .epb the
      # signature round-trip verifies.
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Cache host deps (incl. built mbedTLS)
        uses: actions/cache@v5
        with:
          path: tests/host/.deps
          key: hostdeps-${{ runner.os }}-v1
      # mbedTLS generates its PSA driver wrappers at build time; the generator
      # imports jinja2 and jsonschema. Both are named here rather than relying
      # on GitHub's runner image happening to preinstall jinja2, which the act
      # image Gitea uses does not.
      - name: Install mbedTLS build prerequisites
        # --break-system-packages: PEP 668 marks the system Python externally
        # managed on the act runner image. No-op on GitHub's image, which ships
        # no EXTERNALLY-MANAGED marker.
        run: pip install --quiet --break-system-packages jinja2 jsonschema
      - name: Run full host verification
        run: bash tests/host/run_tests.sh

  case-fit:
    # The enclosure's four invariants: nothing in the panel's insertion path,
    # no overlap between body and lid, and a board carrier that clears both
    # the board and the board's way in. All cheap to check, and all of them
    # were violated by a model that rendered and printed perfectly well.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # sudo is absent from the act runner image Gitea uses, which runs as root.
      - name: Install OpenSCAD
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends openscad
      - name: Check the case fits together
        run: hardware/case/fit_check.sh
      # The RUTA series shares the checker; it cds into hardware/case first.
      - name: Check the RUTA series fits together
        run: hardware/case/fit_check.sh ../cases/serie.scad

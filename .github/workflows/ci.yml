name: ci
# Branch pushes are covered by the pull_request trigger, so `push` is limited to
# main and release tags. Otherwise every commit on a PR branch runs the suite
# twice. Use the Actions tab ("Run workflow") to build a branch that has no PR.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-verification:
    runs-on: ubuntu-latest
    steps:
      # registry/ (the epaper-blocks submodule) provides the signed .epb the
      # signature round-trip verifies.
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Cache host deps (incl. built mbedTLS)
        uses: actions/cache@v5
        with:
          path: tests/host/.deps
          key: hostdeps-${{ runner.os }}-v1
      # mbedTLS generates its PSA driver wrappers at build time and imports
      # jsonschema to do it; without this the first (cold-cache) run fails.
      - name: Install mbedTLS build prerequisites
        run: pip install --quiet jsonschema
      - name: Run full host verification
        run: bash tests/host/run_tests.sh

  case-fit:
    # The enclosure's two invariants: nothing may sit in the panel's insertion
    # path, and the body and lid may not overlap. Both are cheap to check and
    # both were violated by a model that rendered and printed perfectly well.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenSCAD
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends openscad
      - name: Check the case fits together
        run: hardware/case/fit_check.sh

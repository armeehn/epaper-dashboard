name: firmware
# Branch pushes are covered by the pull_request trigger, so `push` is limited to
# main and release tags. Otherwise every commit on a PR branch runs the 7-panel
# matrix twice. Use the Actions tab ("Run workflow") to build a branch with no PR.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-esp32:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - panel: PANEL_75_B_V2
            slug: 75in-800x480-3color
            desc: 'Waveshare 7.5" (B) V2/V3 — 800x480, black/white/red (default)'
          - panel: PANEL_75_BW_V2
            slug: 75in-800x480-bw
            desc: 'Waveshare 7.5" V2 — 800x480, black/white'
          - panel: PANEL_75_HD_B
            slug: 75in-880x528-3color
            desc: 'Waveshare 7.5" HD (B) — 880x528, black/white/red'
          - panel: PANEL_583_B_V2
            slug: 583in-648x480-3color
            desc: 'Waveshare 5.83" (B) V2 — 648x480, black/white/red'
          - panel: PANEL_583_BW_V2
            slug: 583in-648x480-bw
            desc: 'Waveshare 5.83" V2 — 648x480, black/white'
          - panel: PANEL_75_B_V1
            slug: 75in-640x384-3color
            desc: 'Waveshare 7.5" (B) V1 — 640x384, black/white/red (discontinued)'
          - panel: PANEL_75_BW_V1
            slug: 75in-640x384-bw
            desc: 'Waveshare 7.5" V1 — 640x384, black/white'
          # The low-cost build (docs/LOW_COST.md): a XIAO ESP32-C3 on Seeed's
          # driver board, or the XIAO 7.5" panel, driving a GDEY075T7. Another
          # chip, so it carries its own FQBN, esptool chip and bootloader offset.
          - panel: PANEL_75_BW_GDEY
            board: BOARD_XIAO_EPAPER
            slug: xiao-c3-75in-800x480-bw
            desc: 'XIAO ESP32-C3 + Good Display / Seeed 7.5" — 800x480, black/white'
            fqbn: esp32:esp32:XIAO_ESP32C3
            chip: esp32c3
            boot_offset: '0x0'

    steps:
      - uses: actions/checkout@v5

      - name: Cache Arduino core & libraries
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ runner.os }}-v2

      # Not arduino/setup-arduino-cli: that action resolves the release through
      # api.github.com authenticated with GITHUB_TOKEN. On Gitea GITHUB_TOKEN is a
      # *Gitea* token, so GitHub answers "Bad credentials" and every panel in the
      # matrix dies before it compiles anything. The tarball on downloads.arduino.cc
      # needs no API and no token, so one step now serves both hosts.
      - name: Install arduino-cli
        run: |
          VERSION=1.5.1
          SHA256=28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
          TARBALL="arduino-cli_${VERSION}_Linux_64bit.tar.gz"

          curl -fsSL -O "https://downloads.arduino.cc/arduino-cli/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum --check --status

          # ~/.local/bin, not /usr/local/bin: no sudo, so it works as either the
          # `runner` user on GitHub or root in the act container on Gitea.
          mkdir -p "$HOME/.local/bin"
          tar -xzf "${TARBALL}" -C "$HOME/.local/bin" arduino-cli
          rm -f "${TARBALL}"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init --overwrite \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install GxEPD2 ArduinoJson

      - name: Compile sketch (${{ matrix.panel }})
        run: |
          # min_spiffs = two OTA app slots; huge_app has only one and cannot
          # take over-the-air updates. Keep in sync with platformio.ini.
          # A target names its FQBN only when it is not the plain ESP32; the
          # board preset is optional the same way (the default is Waveshare's).
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn || 'esp32:esp32:esp32' }}:PartitionScheme=min_spiffs" \
            --build-property "compiler.cpp.extra_flags=-D${{ matrix.panel }} ${{ matrix.board && format('-D{0}', matrix.board) || '' }}" \
            --export-binaries \
            firmware/epaper_dashboard 2>&1 | tee build.log
          {
            echo "### ${{ matrix.slug }}"
            echo '```'
            grep -E "Sketch uses|Global variables" build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble flashable images
        run: |
          # --break-system-packages: PEP 668 marks the system Python externally
          # managed on the act runner image Gitea uses. No-op on GitHub's image,
          # which ships no EXTERNALLY-MANAGED marker.
          pip install --quiet --break-system-packages esptool==4.8.1
          FQBN="${{ matrix.fqbn || 'esp32:esp32:esp32' }}"
          B=firmware/epaper_dashboard/build/${FQBN//:/.}
          CHIP="${{ matrix.chip || 'esp32' }}"
          # The classic ESP32 boots from 0x1000; the C3 (and S3) from 0x0.
          BOOT="${{ matrix.boot_offset || '0x1000' }}"
          SLUG=${{ matrix.slug }}
          OUT=dist
          mkdir -p "$OUT"

          BOOT_APP0=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -1)
          test -n "$BOOT_APP0" || { echo "boot_app0.bin not found in ESP32 core"; exit 1; }

          python3 -m esptool --chip "$CHIP" merge_bin -o "$OUT/epaper-dashboard-$SLUG-factory.bin" \
            "$BOOT" "$B/epaper_dashboard.ino.bootloader.bin" \
            0x8000  "$B/epaper_dashboard.ino.partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$B/epaper_dashboard.ino.bin"

          cp "$B/epaper_dashboard.ino.bin"            "$OUT/epaper-dashboard-$SLUG-app.bin"
          cp "$B/epaper_dashboard.ino.partitions.bin" "$OUT/epaper-dashboard-partitions.bin"
          cp "$BOOT_APP0"                             "$OUT/boot_app0.bin"

          ( cd "$OUT" && sha256sum \
              "epaper-dashboard-$SLUG-factory.bin" \
              "epaper-dashboard-$SLUG-app.bin" \
              epaper-dashboard-partitions.bin boot_app0.bin \
              > "sha256sums-$SLUG.txt" )

          cat > "$OUT/FLASHING-$SLUG.txt" <<EOF
          e-paper dashboard — ${{ matrix.desc }}
          Built from ${GITHUB_SHA} with the OTA-capable (min_spiffs) partition table.

          FRESH INSTALL (wipes settings; the setup portal reopens)
            pip install esptool==4.8.1
            python3 -m esptool --chip esp32 --port <PORT> --baud 921600 \\
                write_flash 0x0 epaper-dashboard-$SLUG-factory.bin

            Zero-install alternative: flash the same factory image at offset 0x0
            with a WebSerial flasher in Chrome/Edge, e.g.
            https://espressif.github.io/esptool-js/

          UPDATE OVER THE AIR (keeps WiFi, settings, layout and blocks)
            Tap RST, open http://epaper-dashboard.local/ during the editor
            window, go to the Update tab, pick:
                epaper-dashboard-$SLUG-app.bin
            and optionally paste its line from sha256sums-$SLUG.txt.

          UPDATE OVER USB (OTA-table devices)
            python3 -m esptool --chip esp32 --port <PORT> --baud 921600 \\
                write_flash 0xe000 boot_app0.bin \\
                            0x10000 epaper-dashboard-$SLUG-app.bin

          MIGRATING from a pre-OTA (Huge APP) install — one last USB flash.
          Keeps WiFi and wizard settings; saved layout and installed blocks
          reset once, because the data partition moves.
            python3 -m esptool --chip esp32 --port <PORT> --baud 921600 \\
                write_flash 0x8000 epaper-dashboard-partitions.bin \\
                            0xe000 boot_app0.bin \\
                            0x10000 epaper-dashboard-$SLUG-app.bin

          <PORT>: /dev/ttyUSB0 (Linux), /dev/cu.usbserial-XXXX (macOS), COM5 (Windows)
          EOF

      - name: Upload firmware artifact
        if: ${{ contains(github.server_url, 'github.com') }}
        uses: actions/upload-artifact@v5
        with:
          name: epaper-dashboard-${{ matrix.slug }}
          path: dist/

      - name: Upload firmware artifact (Gitea)
        if: ${{ !contains(github.server_url, 'github.com') }}
        uses: christopherHX/gitea-upload-artifact@v4
        with:
          name: epaper-dashboard-${{ matrix.slug }}
          path: dist/

      - name: Attach binaries to release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
